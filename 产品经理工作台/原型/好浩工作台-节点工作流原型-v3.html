<script>

function render(){ $('#nodes').innerHTML=nodes.map(n=>`<article class="node ${n.id} ${selected===n.id?'selected':''} ${n.state}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px" tabindex="0" aria-label="${n.name}节点"><header class="node-head"><span class="node-mark">${icon(n.icon)}</span><div><div class="node-title">${n.name}</div>${n.id==='analysis'?'<div class="ai-skill">AI 产品经理研究助手</div>':''}</div><span class="more">···</span></header>${body(n)}<footer class="node-footer"><span class="status">${stateText(n)}</span><span>${n.id==='analysis'?'DeepSeek':n.id==='report'?'保存到项目':n.id==='input'?'已填写':n.id==='files'?'0 个文件':'保留来源'}</span></footer>${['input','files','analysis'].includes(n.id)?'':`<button class="port in ${n.id==='report'?'top':''}" data-in="${n.id}" data-port="main" aria-label="连接到${n.name}"></button>`}${n.id==='report'?'':`<button class="port out ${n.id==='analysis'?'bottom':''}" data-out="${n.id}" aria-label="从${n.name}连接"></button>`}</article>`).join('');$('#counts').textContent=`${nodes.length} 个节点，${edges.length} 条连接`;drawEdges()}
function point(el){const g=$('#graph').getBoundingClientRect(),r=el.getBoundingClientRect();return{x:(r.x+r.width/2-g.x)/zoom,y:(r.y+r.height/2-g.y)/zoom}}
function drawEdges(){ $('#edges').innerHTML=edges.map(e=>{const a=$(`[data-out="${e.from}"]`),b=$(`[data-in="${e.to}"][data-port="${e.port}"]`);if(!a||!b)return'';const s=point(a),t=point(b),vertical=e.from==='analysis',d=vertical?`M${s.x} ${s.y} C${s.x} ${s.y+35},${t.x} ${t.y-35},${t.x} ${t.y}`:`M${s.x} ${s.y} C${s.x+52} ${s.y},${t.x-52} ${t.y},${t.x} ${t.y}`;const lx=vertical?s.x+26:(s.x+t.x)/2,ly=vertical?(s.y+t.y)/2+3:(s.y+t.y)/2-12;return `<path class="${nodes.find(n=>n.id===e.from).state==='done'?'completed':e.to===selected||e.from===selected?'chosen':''}" d="${d}"/><text x="${lx}" y="${ly}" text-anchor="middle">${e.label}</text>`}).join('')}

if(tab==='output'){$('#details').innerHTML=n.state==='done'?`<div class="section-title">本次输出<small>模拟运行</small></div><div class="output-file"><h3>${n.id==='search'?'来源资料包':n.id==='analysis'?'用户分析结果':n.id==='input'?'研究问题':'用户分析报告'}</h3><p>保留来源、节点与运行版本，供下游使用。</p><button id="view-output">查看内容</button></div><div class="note">${icon('info')}此处为演示数据，不代表实际用户或市场证据。</div>`:`<div class="output-empty">此节点尚未运行。<br>运行后，在这里查看输出、来源和版本。</div>`;if($('#view-output'))$('#view-output').onclick=showReport;return}
if(n.id==='analysis')$('#details').innerHTML=`<div class="section-title">使用的技能<small>当前节点独立使用</small></div><button class="skill-select" id="change-skill" style="width:100%;text-align:left"><div><strong>AI 产品经理研究助手</strong><p>任务范围：用户分析</p></div>${icon('down')}</button><div class="field"><label for="model">执行模型</label><select id="model"><option>DeepSeek · 项目默认模型</option><option>智谱 Coding Plan</option><option>公司内部模型</option></select></div>${field('分析要求',config.analysis)}<div class="field"><label>报告大纲</label><ol class="outline-list" id="outline-list">${['核心用户与群体分布','典型场景与用户任务','痛点与现有替代方案','证据缺口与验证建议'].map((t,i)=>`<li><span>${i+1}</span><div contenteditable="true" role="textbox" aria-label="大纲条目 ${i+1}">${t}</div><b>⠿</b></li>`).join('')}</ol></div><div class="switch-row">缺少关键资料时先向我提问<button class="switch" role="switch" aria-checked="true" aria-label="缺少资料时先提问"><i></i></button></div><div class="note">${icon('info')}只使用已连接的资料与当前技能。事实、推断和假设会分别标注。</div>`;
else if(n.id==='search')$('#details').innerHTML=`<div class="section-title">检索设置</div>${field('检索问题',config.search)}<div class="field"><label>时间范围</label><select><option>近 12 个月</option><option>不限时间</option></select></div><div class="field"><label>搜索服务</label><select><option>跟随当前模型的联网搜索</option><option>Tavily</option><option>Brave Search</option></select></div><div class="field-rule"></div><div class="section-title">输出内容</div><div class="connected"><i></i>标题、链接与公开正文</div><div class="connected"><i></i>发表时间与获取时间</div><div class="connected"><i></i>抓取失败记录与证据局限</div><div class="note">${icon('info')}运行前确认检索词。公开信息不能替代用户访谈证据。</div>`;
else if(n.id==='input')$('#details').innerHTML=`<div class="section-title">研究输入</div>${field('产品想法',config.input)}${field('本轮目标','了解独处上班族的陪伴场景、未满足需求与现有替代方案。','goal')}<div class="note">${icon('info')}作为研究问题传给联网搜索。可连接其他节点复用。</div>`;
else if(n.id==='files')$('#details').innerHTML=`<div class="section-title">补充用户材料<small>可选</small></div><div class="output-file"><h3>访谈、反馈与竞品资料</h3><p>支持 PDF、Word、Excel、图片和文字。解析后先确认，再加入下游。</p><button id="select-file">选择文件</button></div><div class="note">${icon('info')}本原型不读取本机文件。正式版保留每份材料的来源与证据性质。</div>`;
else if(n.id==='report')$('#details').innerHTML=`<div class="section-title">报告设置</div><div class="field"><label for="report-name">文档名称</label><input id="report-name" value="AI 宠物陪伴 · 用户分析报告"></div><div class="field"><label>展示内容</label><div class="options"><button class="active">文档正文</button><button class="active">图表</button><button class="active">总结分析</button></div></div><div class="switch-row">同时生成 HTML 预览<button class="switch off" role="switch" aria-checked="false" aria-label="同时生成 HTML"><i></i></button></div><div class="field-rule"></div><div class="section-title">保存位置</div><div class="connected">${icon('folder')}AI 宠物陪伴 / 项目文档</div><div class="note">${icon('info')}HTML 可在文档完成后按需生成。每份文档保留自己的总结和版本。</div>`;
else $('#details').innerHTML=`<div class="section-title">节点任务</div>${field('处理要求',n.description||'处理上游输入，输出指定结果。')}<div class="note">${icon('info')}这是新增节点的配置示意。正式版由节点包提供输入输出与配置项。</div>`;
if($('#instruction'))$('#instruction').onchange=e=>{config[selected]=e.target.value;toast('已更新此节点的演示配置')};if($('#change-skill'))$('#change-skill').onclick=()=>showModal('选择技能',`<div class="modal-body">${['AI 产品经理研究助手','产品立项报告','产品经理工作流'].map(t=>`<button data-skill="${t}" style="display:flex;width:100%;justify-content:space-between;margin:8px 0">${t}${icon('chevron')}</button>`).join('')}</div>`,'技能只在当前节点内使用');if($('#select-file'))$('#select-file').onclick=()=>toast('演示入口：选择文件、预览解析结果，然后确认加入');document.querySelectorAll('.switch').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);b.classList.toggle('off',!on)});document.querySelectorAll('.options button').forEach(b=>b.onclick=()=>b.classList.toggle('active'))}
function select(id){selected=id;render();renderDetails()}
$('#nodes').addEventListener('click',e=>{const out=e.target.closest('[data-out]'),input=e.target.closest('[data-in]');if(out){linkStart=out.dataset.out;$('#status-text').textContent='点击目标节点的输入圆点，Esc 取消';toast('已选择输出，请点击目标输入');return}if(input&&linkStart){const to=input.dataset.in,port=input.dataset.port;if(to===linkStart){toast('不能连接到自身');return}if(edges.some(edge=>edge.from===linkStart&&edge.to===to&&edge.port===port)){toast('已有此连接');return}if(to==='search'&&linkStart!=='input'){toast('类型不匹配：此输入需要研究问题');return}if(edges.some(edge=>edge.to===linkStart&&edge.from===to)){toast('此连线会形成循环，请调整方向');return}edges.push({from:linkStart,to,port,label:'节点数据'});linkStart=null;render();$('#status-text').textContent='已建立连接';return}const card=e.target.closest('.node');if(card)select(card.dataset.id)});
$('#nodes').addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('.node')){e.preventDefault();select(e.target.dataset.id)}});
$('#nodes').addEventListener('pointerdown',e=>{const head=e.target.closest('.node-head');if(!head)return;const card=head.closest('.node'),n=nodes.find(n=>n.id===card.dataset.id),sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y;head.setPointerCapture(e.pointerId);head.onpointermove=ev=>{n.x=Math.max(0,ox+(ev.clientX-sx)/zoom);n.y=Math.max(0,oy+(ev.clientY-sy)/zoom);card.style.left=n.x+'px';card.style.top=n.y+'px';drawEdges()};head.onpointerup=()=>{head.onpointermove=null;head.onpointerup=null}});

function showModal(title,content,subtitle=''){const m=$('#modal');m.innerHTML=`<header class="modal-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button id="close-modal" aria-label="关闭">✕</button></header>${content}`;m.showModal();$('#close-modal').onclick=()=>m.close()}
const library=[{name:'联网搜索',icon:'search',category:'获取资料',description:'搜索公开网页，保留来源和证据边界。'},{name:'用户分析',icon:'user',category:'AI 分析',description:'识别用户、场景、任务与未满足需求。'},{name:'立项报告',icon:'file',category:'AI 分析',description:'结合研究成果，制作完整立项报告。'},{name:'转化漏斗',icon:'grid',category:'数据计算',description:'计算步骤转化率，定位关键流失。'},{name:'人工确认',icon:'check',category:'流程控制',description:'确认计划或补齐材料后继续执行。'},{name:'文档输出',icon:'folder',category:'输出',description:'保存报告、图表与逐文档总结。'}];
function showLibrary(){showModal('添加节点',`<div class="modal-body"><input class="modal-search" id="node-search" placeholder="搜索节点名称或能力" aria-label="搜索节点"><div class="filters">${['全部','获取资料','AI 分析','数据计算','流程控制','输出'].map((t,i)=>`<button data-filter="${t}" class="${i?'':'active'}">${t}</button>`).join('')}</div><div class="library-grid" id="library-grid"></div></div><div class="modal-footer"><span>独立能力，自由连接，可重复使用。</span><button id="import-node">＋ 导入节点包</button></div>`,'选择一个能力，加入当前工作流');let filter='全部';function list(){let q=$('#node-search').value;$('#library-grid').innerHTML=library.filter(n=>(filter==='全部'||n.category===filter)&&(n.name+n.description).includes(q)).map(n=>`<button class="library-item" data-lib="${n.name}"><span class="item-head">${icon(n.icon)}${n.name}</span><p>${n.description}</p></button>`).join('');document.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{const n=library.find(n=>n.name===b.dataset.lib),id='custom'+nodes.length;nodes.push({...n,id,type:n.category+'节点',x:30,y:410,state:'ready'});$('#modal').close();select(id);toast('已添加'+n.name+'，可拖动并连接')})}$('#node-search').oninput=list;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',b===x));list()});$('#import-node').onclick=()=>showModal('导入节点包',`<div class="modal-body"><p class="output-empty">正式版在这里校验节点的输入输出、配置、执行逻辑与权限，再由你确认导入。</p><p class="small muted">当前是设计原型，不读取或执行外部代码。</p></div>`);list()}
async function run(ids){if(running)return;running=true;$('#run-flow').disabled=true;$('#run-node').disabled=true;$('#workflow-state').textContent='正在模拟运行';$('#status-text').textContent='模拟执行，不联网、不调用模型';for(const id of ids){const n=nodes.find(n=>n.id===id);n.state='running';render();await new Promise(r=>setTimeout(r,650));n.state='done';history.push(n.name);render()}running=false;finished=finished||ids.includes('report');$('#run-flow').disabled=false;$('#run-node').disabled=false;$('#workflow-state').textContent='模拟运行完成';$('#status-text').textContent='模拟结果已保存，可逐节点查看';$('#doc-count').textContent=finished?' 1':'';renderDetails();toast(finished?'演示报告已生成，点击输出文档查看':'此节点模拟运行完成')}
$('#run-flow').onclick=()=>run(['input','search','analysis','report']);$('#run-node').onclick=()=>{let missing=edges.filter(e=>e.to===selected).map(e=>nodes.find(n=>n.id===e.from)).filter(n=>!['done','optional'].includes(n.state));if(missing.length){showModal('先准备上游资料',`<div class="modal-body"><p class="output-empty">${missing.map(n=>n.name).join('、')}尚未产生结果。可先运行所需的上游，再继续此节点。</p><button class="primary" id="run-upstream">运行上游并继续</button></div>`);$('#run-upstream').onclick=()=>{$('#modal').close();let ids=['input','search','analysis','report'].filter(id=>id===selected||missing.some(n=>n.id===id)||id==='input'&&missing.some(n=>n.id==='search'));run(ids)}}else run([selected])};
function showReport(){showModal('AI 宠物陪伴 · 用户分析报告',`<div class="report-content"><div class="sample">原型演示数据，不代表真实搜索、访谈或市场验证。</div><h3>核心判断</h3><p>先围绕独处上班族的连续陪伴场景开展研究。电脑与手机之间的情境衔接是产品假设，需要真实用户证据支持。</p><h3>候选用户与场景</h3><table class="report-table"><tr><th>候选用户</th><th>典型场景</th><th>证据状态</th></tr><tr><td>独居上班族</td><td>工作间隙、晚间独处</td><td>待验证假设</td></tr><tr><td>异地工作者</td><td>下班后、周末独处</td><td>待验证假设</td></tr></table><h3>下一步验证</h3><ul><li>用户是否愿意跨设备与同一只宠物持续互动？</li><li>养成与陪伴，哪个行为更能形成持续使用？</li><li>主动关心的频率和免打扰边界是什么？</li></ul><p style="font-size:10px;color:#a4b0a7;border-top:1px solid #e6ece6;padding-top:14px">资料流转：产品想法 → 联网搜索 → 用户分析 → 报告输出<br>正式版在此追溯上游来源和节点运行版本。</p></div>`,'项目文档 / 模拟输出')}
function showDocs(){if(finished)return showReport();showModal('输出文档',`<div class="modal-body"><p class="output-empty">此工作流尚未产生文档。可以先模拟运行，预览结果如何流转到报告。</p><button class="primary" id="run-docs">模拟运行工作流</button></div>`);$('#run-docs').onclick=()=>{$('#modal').close();run(['input','search','analysis','report'])}}
function showHistory(){showModal('运行记录',`<div class="modal-body">${history.length?history.map(t=>`<div class="history-row">${t}<small>已完成 · 模拟结果</small></div>`).join(''):'<p class="output-empty">尚未运行。这里会按节点保留输入、输出、状态和运行版本。</p>'}</div>`,'当前原型会话，不代表真实模型执行')}
$('#add-node').onclick=$('#nav-library').onclick=$('#node-manage').onclick=showLibrary;$('#docs-tab').onclick=$('#nav-docs').onclick=showDocs;$('#history-tab').onclick=showHistory;$('#edit-tab').onclick=$('#current-flow').onclick=$('#nav-workflow').onclick=()=>{tab='config';select('analysis')};$('#save-template').onclick=()=>toast('已在当前原型会话中保存模板');$('#model-settings').onclick=()=>showModal('模型与连接',`<div class="modal-body"><p class="output-empty">正式版继续使用现有厂商＋Key 接入和钥匙串存储。可由项目提供默认模型，也可在节点中单独选择。</p><p class="small muted">原型不会读取或保存真实 Key。</p></div>`);$('#new-workflow').onclick=()=>showModal('新建工作流',`<div class="modal-body"><p class="output-empty">可以从空白流程开始，也可以选用“用户洞察”“市场研究与立项”“数据分析与迭代”模板。</p><button id="browse-nodes">浏览节点能力</button></div>`);document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>toast('模板入口：'+b.dataset.template+'。当前展示用户洞察流程。'));$('#node-menu').onclick=()=>showModal('节点操作',`<div class="modal-body"><p class="output-empty">清空当前节点的演示上下文与结果，保留配置和连线。</p><button id="clear-context">清空此节点上下文</button></div>`);$('#modal').addEventListener('click',e=>{if(e.target.closest('[data-skill]')){const name=e.target.closest('[data-skill]').dataset.skill;$('#modal').close();toast('已选择技能（演示）：'+name)}if(e.target.id==='browse-nodes'){$('#modal').close();showLibrary()}if(e.target.id==='clear-context'){nodes.find(n=>n.id===selected).state='ready';$('#modal').close();render();renderDetails();toast('已清空当前节点的演示结果')}});
function changeZoom(value){zoom=Math.min(1.3,Math.max(.55,value));$('#graph').style.transform=`translate(-50%,-50%) scale(${zoom})`;$('#zoom-label').textContent=Math.round(zoom*100)+'%';drawEdges()}
function fit(){changeZoom(Math.min(1,($('#canvas').clientWidth-38)/880,($('#canvas').clientHeight-105)/660))}$('#zoom-out').onclick=()=>changeZoom(zoom-.1);$('#zoom-in').onclick=()=>changeZoom(zoom+.1);$('#fit').onclick=$('#minimap').onclick=fit;$('#reset-layout').onclick=()=>{nodes.forEach(n=>{let p=initial.find(v=>v.id===n.id);if(p){n.x=p.x;n.y=p.y}});render();toast('已恢复节点布局')};window.addEventListener('resize',fit);render();renderDetails();if($('#canvas').clientWidth<900||$('#canvas').clientHeight<720)fit();
</script></body></html>
