<aside class="right"><header class="detail-head"><span class="node-icon ai" id="detail-icon"></span><div><h2 id="detail-title">用户分析</h2><p id="detail-subtitle">AI 处理节点</p></div><button id="detail-menu" aria-label="节点操作">···</button></header><div class="detail-tabs"><button class="active" data-tab="config">节点配置</button><button data-tab="assistant">AI 助手</button><button data-tab="output">节点输出</button></div><div class="details" id="details"></div><footer class="detail-foot"><button id="clear-context" aria-label="清空节点上下文"><svg class="icon" style="width:15px"><use href="#i-clock"/></svg></button><button class="primary" id="run-node"><svg class="icon" style="width:14px"><use href="#i-play"/></svg>运行此节点</button></footer></aside></div>
<dialog id="modal"></dialog><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),icon=n=>`<svg class="icon"><use href="#i-${n}"/></svg>`;
let nodes=[{id:'input',name:'产品想法',kind:'输入节点',icon:'input',style:'',x:35,y:119,text:'面向独处上班族的 AI 宠物，白天在电脑陪伴，晚上用手机继续互动。',foot:'研究问题',state:'ready'},{id:'search',name:'联网搜索',kind:'信息获取节点',icon:'search',style:'search',x:365,y:119,text:'AI 宠物陪伴 · 用户需求与替代方案<br>公开网页，保留来源与获取时间',foot:'来源资料',state:'ready'},{id:'files',name:'上传材料',kind:'输入节点',icon:'folder',style:'file',x:365,y:389,text:'可上传访谈、用户反馈与竞品资料<br><span style="color:#a8b4aa">未添加文件，本次可跳过</span>',foot:'用户材料',state:'optional'},{id:'analysis',name:'用户分析',kind:'AI 处理节点',icon:'user',style:'ai',x:695,y:249,text:'识别用户群体、场景与痛点<br>结合公开资料，区分事实与假设',foot:'用户分析结果',state:'ready'},{id:'report',name:'报告输出',kind:'输出节点',icon:'file',style:'report',x:695,y:509,text:'用户分析报告<br><span style="color:#a0ada3">文档 · 图表 · 总结分析</span>',foot:'项目文档',state:'ready'}];
let edges=[{from:'input',to:'search',label:'检索问题'},{from:'search',to:'analysis',label:'公开资料'},{from:'files',to:'analysis',label:'访谈与反馈'},{from:'analysis',to:'report',label:'分析结果',vertical:true}],selected='analysis',tab='config',running=false,finished=false,linkStart=null,zoom=1;
const cfg={analysis:{instruction:'结合上游材料，分析核心用户、典型使用场景、痛点及现有替代方案。明确证据不足和待验证假设。',outline:'核心用户与群体分布\n典型场景与用户任务\n痛点与现有替代方案\n关键假设与下一步验证'},search:{instruction:'AI 宠物陪伴 用户需求\n独居 上班族 情感陪伴 替代方案'},input:{instruction:'我想做 AI 手机电脑双端互通的宠物情感陪伴产品，面向经常独处的上班族，兼顾养成和轻社交。'}};
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.remove('show'),2600)}
function render(){ $('#nodes').innerHTML=nodes.map(n=>`<article class="node ${selected===n.id?'selected':''} ${n.state==='done'?'done':''} ${n.state==='running'?'running':''}" style="left:${n.x}px;top:${n.y}px" data-id="${n.id}" tabindex="0" aria-label="${n.name}节点"><header class="node-top"><span class="node-icon ${n.style}">${icon(n.icon)}</span><div><div class="node-name">${n.name}</div><div class="node-kind">${n.kind}</div></div><span class="node-menu">···</span></header><div class="node-body"><div class="node-content">${n.text}</div></div><footer class="node-footer"><span class="status">${n.state==='done'?'已完成 · 演示':n.state==='running'?'正在处理':n.state==='optional'?'可选输入':'配置就绪'}</span><span class="node-footnote">${n.foot}</span></footer>${n.id==='input'||n.id==='files'?'':`<button class="port in ${n.id==='report'?'top':''}" data-in="${n.id}" aria-label="连接到${n.name}"></button>`}${n.id==='report'?'':`<button class="port out ${n.id==='analysis'?'bottom':''}" data-out="${n.id}" aria-label="从${n.name}连接"></button>`}</article>`).join('');$('#node-count').textContent=`${nodes.length} 个节点 · ${edges.length} 条连接`;drawEdges();renderTrack();}
function drawEdges(){const positions=n=>({x:n.x,y:n.y,w:230,h:$('.node[data-id="'+n.id+'"]').offsetHeight});$('#edges').innerHTML=edges.map(e=>{let a=positions(nodes.find(n=>n.id===e.from)),b=positions(nodes.find(n=>n.id===e.to)),sx=a.x+a.w,sy=a.y+a.h/2,tx=b.x,ty=b.y+b.h/2,path,ly,lx;if(e.vertical){sx=a.x+a.w/2;sy=a.y+a.h;tx=b.x+b.w/2;ty=b.y;path=`M ${sx} ${sy} C ${sx} ${sy+45},${tx} ${ty-45},${tx} ${ty}`;lx=sx+30;ly=(sy+ty)/2+3}else{path=`M ${sx} ${sy} C ${sx+65} ${sy},${tx-65} ${ty},${tx} ${ty}`;lx=(sx+tx)/2;ly=(sy+ty)/2-12}return `<path class="${nodes.find(n=>n.id===e.from).state==='done'?'finished':''}" d="${path}"/><text x="${lx}" y="${ly}" text-anchor="middle">${e.label}</text>`}).join('')}
function renderTrack(){const order=['input','search','analysis','report'];$('#run-track').innerHTML=order.map((id,i)=>{const n=nodes.find(n=>n.id===id);return `${i?'<span class="track-line"></span>':''}<span class="track-step ${n.state==='done'?'complete':n.state==='running'?'executing':''}"><i>${n.state==='done'?'✓':i+1}</i>${n.name}${n.state==='running'?'…':''}</span>`}).join('')}
function field(label,value,type='textarea',id='instruction'){return `<div class="field"><label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}">${value}</textarea>`:`<input id="${id}" value="${value}">`}</div>`}
function renderDetails(){const n=nodes.find(n=>n.id===selected);$('#detail-title').textContent=n.name;$('#detail-subtitle').textContent=n.kind;$('#detail-icon').className='node-icon '+n.style;$('#detail-icon').innerHTML=icon(n.icon);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#run-node').disabled=running;
if(tab==='assistant'){ $('#details').innerHTML=`<div class="chat-box"><div class="small muted">${n.name}专属助手</div><div class="assistant-bubble">${n.id==='analysis'?'我会接收「联网搜索」的公开资料和「上传材料」的用户反馈。<br><br>分析时会把真实用户证据和推测分开。缺少访谈数据时，我会标注证据缺口。<br><br>本轮要优先关注哪类用户？':`可以在这里补充「${n.name}」的要求。对话只影响当前节点。`}</div><div class="chat-note">补充要求会保存在此节点，不影响其他节点。</div><div id="chat-replies"></div><form class="chat-input" id="chat-form"><input aria-label="向节点助手补充要求" placeholder="补充这个节点的要求…" required><button class="primary" aria-label="发送">↑</button></form></div>`;$('#chat-form').onsubmit=e=>{e.preventDefault();let t=$('#chat-form input').value;const p=document.createElement('p');p.textContent='你：'+t;$('#chat-replies').append(p);const a=document.createElement('div');a.className='assistant-bubble';a.textContent='已将补充要求加入当前节点。（原型演示，不会调用模型）';$('#chat-replies').append(a);$('#chat-form').reset()};return}
if(tab==='output'){ $('#details').innerHTML=finished||n.state==='done'?`<div class="section-label">本次输出<span>模拟运行</span></div><div class="output-item"><b>${n.id==='search'?'来源资料包':n.id==='analysis'?'用户分析结果':n.id==='input'?'研究问题':'用户分析报告'}</b><p>保留节点来源与版本，可供下游节点使用。</p><button id="view-output">查看${n.id==='search'?'来源':'内容'}</button></div><div class="tip">${icon('info')}此处为原型演示，不代表真实调研或用户验证。</div>`:`<div class="empty-hint">运行此节点后，输出内容会出现在这里。<br><br>每次运行保留独立版本，下游可以引用指定版本的结果。</div>`;if($('#view-output'))$('#view-output').onclick=showReport;return}
if(n.id==='analysis'){ $('#details').innerHTML=`<div class="section-label">使用的技能<span>仅作用于此节点</span></div><div class="binding">${icon('user')}<div><b>AI 产品经理研究助手</b><p>当前任务：用户分析</p></div><button id="change-skill">更换</button></div><div class="divider"></div><div class="section-label">已连接的输入<span>${edges.filter(e=>e.to===selected).length} 项</span></div><div class="input-wire"><i></i>联网搜索<span class="wire">→</span>公开资料<b>已连接</b></div><div class="input-wire file"><i></i>上传材料<span class="wire">→</span>用户材料<b>可选</b></div><div class="divider"></div>${field('分析要求',cfg.analysis.instruction)}<div class="section-label">报告大纲<span>可编辑</span></div><div class="outline" contenteditable="true" role="textbox" aria-label="报告大纲">${cfg.analysis.outline}</div><div class="toggle"><label><input type="checkbox" checked> 缺少关键资料时，先向我提问</label></div><div class="tip">${icon('info')}只使用当前技能与已连接的上游资料，来源和证据状态随结果保留。</div>`;$('#change-skill').onclick=()=>showModal('选择技能',`<div class="library">${['AI 产品经理研究助手','产品立项报告','产品经理工作流'].map(t=>`<button class="library-item skill-choice" style="width:100%;margin:8px 0">${t}</button>`).join('')}</div>`);}
else if(n.id==='search')$('#details').innerHTML=`<div class="section-label">检索来源</div><div class="field"><label>搜索服务</label><select><option>随当前模型使用联网搜索</option><option>Tavily</option><option>Brave Search</option></select></div>${field('检索问题',cfg.search.instruction)}<div class="field"><label>时间范围</label><select><option>近 12 个月</option><option>不限时间</option></select></div><div class="section-label">输出资料</div><div class="outline">网页标题与链接<br>摘要与可读取的正文<br>发布时间与获取时间<br>失败记录与证据局限</div><div class="tip">${icon('info')}公开搜索结果不等于真实用户证据。执行前可确认将发送的检索词。</div>`;
else if(n.id==='input')$('#details').innerHTML=`${field('想法与背景',cfg.input.instruction)}${field('本轮目标','了解独处上班族的陪伴场景、需求及现有替代方案。','textarea','goal')}<div class="tip">${icon('info')}输入将作为研究问题传给下游联网搜索节点。</div>`;
else if(n.id==='files')$('#details').innerHTML=`<div class="section-label">本次材料<span>可选</span></div><div class="outline" style="text-align:center;padding:26px 10px">${icon('folder')}<br>访谈、用户反馈、竞品资料<br><button id="demo-upload" style="margin-top:10px;font-size:11px">选择文件</button></div><div class="tip">${icon('info')}支持 PDF、Word、Excel、图片与文字。解析后需确认，才会传给下游节点。</div>`;
else $('#details').innerHTML=`${field('文档名称','AI 宠物陪伴 · 用户分析报告','input','report-name')}<div class="section-label">展示内容</div><div class="toggle"><label><input type="checkbox" checked> 文档正文与图表</label></div><div class="toggle"><label><input type="checkbox" checked> 当前文档的总结分析</label></div><div class="toggle"><label><input type="checkbox"> 运行后生成 HTML 预览</label></div><div class="divider"></div><div class="section-label">保存位置</div><div class="binding">${icon('folder')}<b>AI 宠物陪伴 / 项目文档</b></div><div class="tip">${icon('info')}HTML 默认关闭，可在报告生成后按需制作。</div>`;
const input=$('#instruction');if(input)input.onchange=()=>{cfg[selected]??={};cfg[selected].instruction=input.value;toast('已更新此节点的要求')};const outline=$('.outline[contenteditable]');if(outline)outline.oninput=()=>cfg.analysis.outline=outline.innerText;if($('#demo-upload'))$('#demo-upload').onclick=()=>toast('原型演示：正式版在此选择文件并确认解析结果');}
function selectNode(id){selected=id;render();renderDetails()}
$('#nodes').addEventListener('click',e=>{const out=e.target.closest('[data-out]'),inn=e.target.closest('[data-in]');if(out){linkStart=out.dataset.out;$('#canvas-hint').textContent='选择目标节点左侧或顶部的输入圆点';toast('已选择输出端，请点击目标节点的输入端');return}if(inn&&linkStart){const to=inn.dataset.in;if(to===linkStart||edges.some(e=>e.from===linkStart&&e.to===to)){toast('这两个节点已有连接或无法连接自身');return}if(to==='search'&&linkStart!=='input'){toast('类型不匹配：联网搜索需要研究问题');return}if(linkStart==='report'||to==='input'||to==='files'){toast('这两个端口的数据类型不兼容');return}edges.push({from:linkStart,to,label:'节点数据',vertical:linkStart==='analysis'&&to==='report'});linkStart=null;render();toast('已建立连接（原型演示）');return}const n=e.target.closest('.node');if(n)selectNode(n.dataset.id)});
$('#nodes').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.node')){e.preventDefault();selectNode(e.target.dataset.id)}});
$('#nodes').addEventListener('pointerdown',e=>{const h=e.target.closest('.node-top');if(!h)return;const card=h.closest('.node'),n=nodes.find(n=>n.id===card.dataset.id);let startX=e.clientX,startY=e.clientY,ox=n.x,oy=n.y;h.setPointerCapture(e.pointerId);h.onpointermove=ev=>{n.x=Math.max(10,ox+(ev.clientX-startX)/zoom);n.y=Math.max(75,oy+(ev.clientY-startY)/zoom);card.style.left=n.x+'px';card.style.top=n.y+'px';drawEdges()};h.onpointerup=()=>{h.onpointermove=null;h.onpointerup=null}});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderDetails()});
function showModal(title,content,subtitle=''){const m=$('#modal');m.innerHTML=`<header class="modal-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button id="close-modal" aria-label="关闭">✕</button></header>${content}`;m.showModal();$('#close-modal').onclick=()=>m.close();document.querySelectorAll('.skill-choice').forEach(b=>b.onclick=()=>{$('#modal').close();toast('已选择技能（演示）：'+b.textContent)})}
const library=[['search','联网搜索','获取公开资料，保留可追溯来源。','信息获取'],['user','用户分析','从材料中识别用户、场景与痛点。','AI 处理'],['file','立项报告','结合研究成果，制作立项评审文档。','AI 处理'],['grid','转化漏斗','计算步骤转化率与流失，生成图表。','数据计算'],['check','人工确认','确认计划或补充信息后，再继续执行。','流程控制'],['folder','文档输出','将结果保存为可查看、导出的文档。','输出']];
function showLibrary(){showModal('添加节点',`<div class="library"><div class="field" style="margin:0"><input id="library-search" aria-label="搜索节点" placeholder="搜索节点名称或能力"></div><div class="library-filter">${['全部','信息获取','AI 处理','数据计算','流程控制','输出'].map((s,i)=>`<button class="${i?'':'active'}" data-filter="${s}">${s}</button>`).join('')}</div><div class="library-grid" id="library-grid"></div></div><div class="library-footer"><span>新能力以独立节点接入，可重复用于不同工作流。</span><button id="import-node">＋ 导入节点包</button></div>`,'选择一个能力，加入当前工作流');let filter='全部';function grid(){let q=$('#library-search').value;$('#library-grid').innerHTML=library.filter(a=>(filter==='全部'||a[3]===filter)&&a.join('').includes(q)).map(a=>`<button class="library-item" data-lib="${a[1]}"><span class="item-head"><span class="node-icon ${a[3]==='AI 处理'?'ai':'search'}">${icon(a[0])}</span>${a[1]}</span><p>${a[2]}</p></button>`).join('');document.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{let a=library.find(x=>x[1]===b.dataset.lib),id='custom'+nodes.length;nodes.push({id,name:a[1],kind:a[3]+'节点',icon:a[0],style:a[3]==='AI 处理'?'ai':'search',x:40,y:445,text:a[2],foot:'待连接',state:'ready'});$('#modal').close();selectNode(id);toast('已添加'+a[1]+'，可从输出圆点连接')})}$('#library-search').oninput=grid;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));grid()});$('#import-node').onclick=()=>showModal('导入节点包',`<div class="library"><div class="outline">正式版将读取节点名称、输入输出端口、配置表单、执行逻辑与权限。<br><br>导入后先查看权限并确认，再加入节点库。</div><p class="small muted">当前是交互原型，不会加载或执行外部代码。</p><button id="back-library">返回节点库</button></div>`);grid()}
async function run(ids){if(running)return;running=true;$('#run-flow').disabled=true;$('#run-node').disabled=true;$('#run-title').innerHTML='正在模拟运行 <span class="muted small" style="font-weight:400;margin-left:9px">不调用模型，不联网</span>';for(const id of ids){const n=nodes.find(n=>n.id===id);n.state='running';render();await new Promise(r=>setTimeout(r,650));n.state='done';render()}running=false;finished=ids.includes('report')||finished;$('#run-flow').disabled=false;$('#run-node').disabled=false;$('#run-title').innerHTML='模拟运行完成 <span class="muted small" style="font-weight:400;margin-left:9px">已保留每个节点的结果</span>';$('#doc-count').textContent=finished?'1':'0';renderDetails();toast(finished?'演示报告已生成，可点击“输出文档”查看':'此节点模拟运行完成，可在节点输出中查看')}
$('#run-flow').onclick=()=>run(['input','search','analysis','report']);$('#run-node').onclick=()=>{const parents=edges.filter(e=>e.to===selected).map(e=>nodes.find(n=>n.id===e.from));const missing=parents.filter(n=>!['done','optional'].includes(n.state));if(missing.length){showModal('此节点需要上游资料',`<div class="library"><p class="empty-hint">${missing.map(n=>n.name).join('、')}尚未产生结果。可以先运行所需上游，再运行当前节点。</p><button class="primary" id="run-upstream">先运行上游并继续</button></div>`);$('#run-upstream').onclick=()=>{$('#modal').close();const ids=['input','search','analysis','report'].filter(id=>id===selected||missing.some(n=>n.id===id)||id==='input'&&missing.some(n=>n.id==='search'));run(ids)}}else run([selected])};
function showReport(){showModal('用户分析报告',`<div class="report-content"><div class="sample">原型示例 · 以下内容用于展示排版，不是实际搜索、访谈或市场验证结果。</div><h3>核心判断</h3><p>优先围绕独处上班族的连续陪伴场景展开研究。电脑与手机之间的情境衔接，是待验证的产品假设。</p><h3>用户与典型场景</h3><table class="report-table"><tr><th>候选群体</th><th>典型场景</th><th>证据状态</th></tr><tr><td>独居上班族</td><td>工作间隙、晚间独处</td><td>待验证假设</td></tr><tr><td>异地工作者</td><td>下班后、周末独处</td><td>待验证假设</td></tr></table><h3>需要进一步验证</h3><ul><li>用户是否愿意跨设备维持同一只宠物的互动？</li><li>陪伴与养成，哪一种行为更能形成持续使用？</li><li>主动关心的频率与免打扰边界是什么？</li></ul><p style="border-top:1px solid var(--line);padding-top:14px;font-size:10px">来源链路：产品想法 → 联网搜索 → 用户分析 → 报告输出<br>正式版在此保留来源链接、节点版本与生成时间。</p></div>`,'AI 宠物陪伴 / 项目文档 / 模拟输出')}
function showOutputs(){if(finished)showReport();else showModal('输出文档',`<div class="library"><p class="empty-hint">这个流程尚未生成报告。点击“运行工作流”可预览完整过程。</p><button class="primary" id="run-from-docs">模拟运行工作流</button></div>`);if($('#run-from-docs'))$('#run-from-docs').onclick=()=>{$('#modal').close();run(['input','search','analysis','report'])}}
$('#result-tab').onclick=showOutputs;$('#nav-docs').onclick=showOutputs;$('#add-node').onclick=showLibrary;$('#nav-library').onclick=showLibrary;$('#manage-nodes').onclick=showLibrary;$('#nav-history').onclick=$('#log-detail').onclick=()=>showModal('运行记录',`<div class="library"><p class="small muted">当前原型会话 · 模拟执行记录</p>${nodes.filter(n=>n.state==='done').length?nodes.filter(n=>n.state==='done').map(n=>`<div class="history-row">${icon(n.icon)}${n.name}<span>已完成 · 演示结果</span></div>`).join(''):'<p class="empty-hint">尚未运行。运行后可逐节点查看输入、输出及失败原因。</p>'}</div>`);$('#save-template').onclick=()=>toast('已在本次原型会话中保存模板');$('#clear-context').onclick=()=>showModal('清空此节点上下文？',`<div class="library"><p class="empty-hint">仅清空“${nodes.find(n=>n.id===selected).name}”的演示对话与结果，保留配置和连接。</p><button class="primary" id="confirm-clear">清空此节点</button></div>`);$('#modal').addEventListener('click',e=>{if(e.target.id==='confirm-clear'){nodes.find(n=>n.id===selected).state='ready';$('#modal').close();render();renderDetails();toast('已清空当前节点的演示上下文')}if(e.target.id==='back-library'){ $('#modal').close();showLibrary()}});$('#settings').onclick=()=>showModal('模型与连接',`<div class="library"><div class="field"><label>模型厂商</label><select><option>DeepSeek</option><option>智谱 Coding Plan</option><option>内部模型服务</option></select></div><p class="empty-hint">原型不会读取或保存真实 Key。正式版继续使用工作台的模型设置与钥匙串存储。</p></div>`);$('#detail-menu').onclick=()=>toast('此节点可复制、停用，或从当前工作流移除（交互示意）');$('#new-flow').onclick=()=>showModal('新建工作流',`<div class="library"><p class="empty-hint">可以从空白画布开始，也可以复用工作流模板。</p><button id="template-library">浏览节点能力</button></div>`);$('#modal').addEventListener('click',e=>{if(e.target.id==='template-library'){ $('#modal').close();showLibrary()}});document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>toast('模板入口：'+b.dataset.template+'，本版重点预览用户洞察流程'));$('#current-flow').onclick=$('#nav-flow').onclick=$('#canvas-tab').onclick=()=>{tab='config';selectNode('analysis')};function changeZoom(v){zoom=Math.min(1.3,Math.max(.6,v));$('#graph').style.transform=`scale(${zoom})`;$('#zoom-label').textContent=Math.round(zoom*100)+'%'}$('#zoom-out').onclick=()=>changeZoom(zoom-.1);$('#zoom-in').onclick=()=>changeZoom(zoom+.1);$('#fit').onclick=()=>changeZoom(Math.min(1,($('#canvas').clientWidth-35)/950));render();renderDetails();
</script></body></html>
