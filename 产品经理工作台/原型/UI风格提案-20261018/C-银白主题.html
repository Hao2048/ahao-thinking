function library(){modal('添加节点',`<p class="preview-hint">选择一种已有能力，添加到当前演示画布。</p><div class="library-list">${[['idea','文字输入','想法、背景与研究目标'],['search','联网搜索','收集公开资料并保留来源'],['folder','文档输入','补充访谈、表格与竞品材料'],['user','用户分析','识别群体、任务与证据缺口'],['file','报告输出','按大纲组织与导出文档']].map(([i,t,d])=>`<button data-add="${i}">${ic(i)}<span>${t}<small>${d}</small></span></button>`).join('')}</div>`);$$('[data-add]').forEach(b=>b.onclick=()=>{undo.push(JSON.stringify(nodes));const kind=b.dataset.add==='file'?'report':b.dataset.add==='user'?'analysis':'input',n={id:'extra'+Date.now(),name:b.querySelector('span').childNodes[0].textContent,kind,icon:b.dataset.add,x:90+nodes.length*15,y:70+nodes.length*12,desc:'新节点示例，可拖动位置并编辑目标。',meta:'尚未连接'};nodes.push(n);$('#modal').close();select(n.id);toast('已添加演示节点')})}
const $$=s=>[...document.querySelectorAll(s)];const tools=[['select','选择 V'],['pan','拖动画布 H / Space'],['color','节点底色 C'],['fit','打组 G'],['plus','添加节点 N'],['undo','撤销 ⌘Z'],['keys','快捷键 ?']];$('.toolbox').innerHTML=tools.map(([i,t],k)=>`${k===2||k===5?'<div class="separator"></div>':''}<button data-tool="${i}" aria-label="${t}" title="${t}" class="${i==='select'?'active':''}">${ic(i)}</button>`).join('');
function setTool(t){if(['select','pan'].includes(t)){tool=t;$$('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('.stage').style.cursor=t==='pan'?'grab':''}else if(t==='plus')library();else if(t==='fit'){grouped=!grouped;paint();toast(grouped?'已演示材料分组':'已取消材料分组')}else if(t==='undo'){if(undo.length){nodes=JSON.parse(undo.pop());if(!nodes.some(n=>n.id===selected))selected='user';paint();renderInspector();toast('已撤销上一次节点操作')}else toast('暂无可撤销操作')}else if(t==='color'){modal('节点底色',`<p class="preview-hint">只修改当前选中节点的演示底色。</p><div class="color-options">${['#eef4ff','#f4eddc','#eee9f8','#e8f2ec'].map(c=>`<button style="background:${c}" data-color="${c}" aria-label="设置颜色 ${c}"></button>`).join('')}</div>`);$$('[data-color]').forEach(b=>b.onclick=()=>{undo.push(JSON.stringify(nodes));nodes.find(n=>n.id===selected).color=b.dataset.color;$('#modal').close();paint()})}else if(t==='keys')modal('画布快捷键','<div class="doc-preview"><p>V　选择节点</p><p>H / Space　拖动画布</p><p>N　添加节点</p><p>C　节点底色</p><p>G　材料分组</p><p>+ / −　缩放　　0　适应画布</p><p>⌘Z　撤销节点操作</p><p>方向键　移动选中节点</p></div>')}
$$('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$$('[data-nav]').forEach(b=>b.onclick=()=>b.dataset.nav==='library'?library():b.dataset.nav==='documents'?showReport():toast('当前为工作流编辑视图'));$$('[data-demo]').forEach(b=>b.onclick=()=>toast(b.dataset.demo));$('#project-picker').onclick=()=>toast('当前演示项目：AI 宠物陪伴');$('#save-template').onclick=()=>toast('原型演示：模板已保存');$('#model-settings').onclick=()=>modal('模型与连接','<label><span>模型服务</span><select><option>DeepSeek</option><option>智谱 Coding Plan</option><option>OpenAI</option></select></label><label><span>API Key</span><input type="password" placeholder="原型不保存、不提交密钥"></label><p class="preview-hint">只展示设置版式，请勿在原型里填写真实密钥。</p>');$$('[data-itab]').forEach(b=>b.onclick=()=>{tab=b.dataset.itab;renderInspector()});$$('[data-worktab]').forEach(b=>b.onclick=()=>{if(b.dataset.worktab==='history')modal('运行记录','<p class="preview-hint">此原型未执行真实任务。</p><div class="doc-preview"><p>运行时会逐节点显示状态、耗时与输出。</p></div>');else if(b.dataset.worktab==='output')showReport()});
async function run(single){if(running)return;running=true;const list=single?[nodes.find(n=>n.id===selected)]:nodes;$('#flow-state').textContent='演示运行中';for(const n of list){n.state='running';paint();await new Promise(r=>setTimeout(r,550));n.state='done';paint()}running=false;$('#flow-state').textContent='演示完成';toast('交互演示完成；未调用模型或执行联网检索')};$('#run-flow').onclick=()=>run(false);$('#run-node').onclick=()=>run(true);
$$('[data-zoom]').forEach(b=>b.onclick=()=>{if(b.dataset.zoom==='fit'){fit();return}const k=view.k;view.k=Math.max(.45,Math.min(1.6,k*(b.dataset.zoom==='in'?1.12:1/1.12)));const box=$('.stage').getBoundingClientRect();view.x=box.width/2-(box.width/2-view.x)*view.k/k;view.y=box.height/2-(box.height/2-view.y)*view.k/k;transform()});
let drag=null;$('.stage').addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('.zoom'))return;const el=e.target.closest('[data-node]');if(el&&tool!=='pan'){const id=el.dataset.node;if(selected!==id){selected=id;$$('.node').forEach(x=>x.classList.toggle('selected',x.dataset.node===id));renderInspector()}if(e.target.closest('.node-header')){undo.push(JSON.stringify(nodes));const n=nodes.find(n=>n.id===id);drag={type:'node',id,x:e.clientX,y:e.clientY,nx:n.x,ny:n.y};e.preventDefault()}}else if(tool==='pan'||e.target===$('.stage'))drag={type:'pan',x:e.clientX,y:e.clientY,nx:view.x,ny:view.y}});window.addEventListener('pointermove',e=>{if(!drag)return;if(drag.type==='pan'){view.x=drag.nx+e.clientX-drag.x;view.y=drag.ny+e.clientY-drag.y;transform()}else{const n=nodes.find(n=>n.id===drag.id);n.x=drag.nx+(e.clientX-drag.x)/view.k;n.y=drag.ny+(e.clientY-drag.y)/view.k;paint()}});window.addEventListener('pointerup',()=>drag=null);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||$('#modal').open)return;const key=e.key.toLowerCase();if((e.metaKey||e.ctrlKey)&&key==='z'){e.preventDefault();setTool('undo');return}if(key==='n')setTool('plus');if(key==='v')setTool('select');if(key==='h')setTool('pan');if(key==='c')setTool('color');if(key==='g')setTool('fit');if(key==='?')setTool('keys');if(key==='0')fit();if(key==='+'||key==='=')document.querySelector('[data-zoom=in]').click();if(key==='-')document.querySelector('[data-zoom=out]').click();if(key===' '){e.preventDefault();setTool('pan')}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();undo.push(JSON.stringify(nodes));const n=nodes.find(x=>x.id===selected);n.x+=e.key==='ArrowRight'?10:e.key==='ArrowLeft'?-10:0;n.y+=e.key==='ArrowDown'?10:e.key==='ArrowUp'?-10:0;paint()}});document.addEventListener('keyup',e=>{if(e.key===' '&&!e.target.matches('input,textarea'))setTool('select')});new ResizeObserver(()=>fit()).observe($('.stage'));paint();renderInspector();requestAnimationFrame(fit);

const themeButton=document.querySelector('#prototype-theme');
function applyPrototypeTheme(theme){const silver=theme==='light';document.body.classList.toggle('silver',silver);document.body.dataset.theme=theme;themeButton.textContent=silver?'深色主题':'银白主题';themeButton.setAttribute('aria-label',silver?'切换为深色主题':'切换为银白主题');try{localStorage.setItem('haoh-c-prototype-theme',theme)}catch{}}
let initialTheme='light';try{initialTheme=new URLSearchParams(location.search).get('theme')||'light'}catch{}
applyPrototypeTheme(initialTheme==='light'?'light':'dark');themeButton.onclick=()=>applyPrototypeTheme(document.body.classList.contains('silver')?'dark':'light');
// The project selector remains visible on the compact rail.
document.querySelector('#project-picker').onclick=()=>{modal('选择项目',`<label><span>当前项目</span><select id="prototype-project"><option>AI 宠物陪伴</option><option>产品工作台设计</option></select></label><p class="preview-hint">这里展示项目切换方式；示例工作流保留当前演示内容。</p><button id="prototype-project-save" class="primary">切换项目</button>`);document.querySelector('#prototype-project-save').onclick=()=>{const name=document.querySelector('#prototype-project').value;document.querySelector('#project-picker').innerHTML=esc(name)+ic('chevron');document.querySelector('.crumb span').textContent=name;document.querySelector('#modal').close();toast('已切换演示项目')}};
document.querySelectorAll('.flows .flow-link:not(.sub)').forEach(button=>button.onclick=()=>{document.querySelectorAll('.flows .flow-link').forEach(b=>b.classList.toggle('current',b===button));document.querySelector('.head-title h1').textContent=button.textContent.trim()==='用户洞察'?'AI 宠物的用户洞察':button.textContent.trim();toast('已演示工作流切换，画布为统一示例')});
</script></body></html>
